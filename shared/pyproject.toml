[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finelo-shared"
version = "0.1.0"
description = "Shared library for Finelo microservices"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "aio-pika>=9.4.0",
    "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]
