[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quiz-service"
version = "0.1.0"
description = "Finelo Quiz Microservice"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "sqlalchemy[asyncio]==2.0.48",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    "redis[hiredis]==7.4.0",
    "aio-pika==9.6.2",
    "structlog==25.5.0",
    "slowapi==0.1.9",
    "finelo-shared",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "anyio==4.13.0",
    "faker==40.11.1",
    "pytest-dotenv==0.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "alembic/*"]
