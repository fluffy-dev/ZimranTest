[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quiz-service"
version = "0.1.0"
description = "Finelo Quiz Microservice"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "redis[hiredis]>=5.0.0",
    "aio-pika>=9.4.0",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "finelo-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.3.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
