services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  quiz_db:
    image: postgres:16-alpine
    container_name: finelo_quiz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quiz_db
    ports:
      - "5432:5432"
    volumes:
      - quiz_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d quiz_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  balance_db:
    image: postgres:16-alpine
    container_name: finelo_balance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: balance_db
    ports:
      - "5433:5432"
    volumes:
      - balance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d balance_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finelo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: finelo_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Migrations (run-once) ──────────────────────────────────────────────────

  quiz_migrate:
    build:
      context: .
      dockerfile: quiz_service/Dockerfile
      target: builder
    container_name: finelo_quiz_migrate
    command: >
      sh -c "
        pip install alembic asyncpg &&
        alembic upgrade head
      "
    working_dir: /home/finelo/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@quiz_db:5432/quiz_db
    depends_on:
      quiz_db:
        condition: service_healthy
    volumes:
      - ./quiz_service:/home/finelo/app
      - ./shared:/shared
    restart: "no"

  balance_migrate:
    build:
      context: .
      dockerfile: balance_service/Dockerfile
      target: builder
    container_name: finelo_balance_migrate
    command: >
      sh -c "
        pip install alembic asyncpg &&
        alembic upgrade head
      "
    working_dir: /home/finelo/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@balance_db:5432/balance_db
    depends_on:
      balance_db:
        condition: service_healthy
    volumes:
      - ./balance_service:/home/finelo/app
      - ./shared:/shared
    restart: "no"

  # ── Application Services ───────────────────────────────────────────────────

  quiz_service:
    build:
      context: .
      dockerfile: quiz_service/Dockerfile
    container_name: finelo_quiz_service
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - ./quiz_service/.env
    depends_on:
      quiz_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      quiz_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  balance_service:
    build:
      context: .
      dockerfile: balance_service/Dockerfile
    container_name: finelo_balance_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./balance_service/.env
    depends_on:
      balance_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      balance_migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  quiz_db_data:
  balance_db_data:
  redis_data:
  rabbitmq_data:
